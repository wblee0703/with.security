name: Deploy WithSecurity to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Copy template, stylesheet, javascript to Build Output
        run: |
          mkdir -p dist/template dist/stylesheet dist/javascript
          cp -r template/* dist/template/
          cp -r stylesheet/* dist/stylesheet/
          cp -r javascript/* dist/javascript/
          cp index.html dist/

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
